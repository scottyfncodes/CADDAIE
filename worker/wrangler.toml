# CADDAIE API — the server-side AI proxy for the CADDAIE web app.
# Secrets are NEVER stored here. Set the key with:
#   npx wrangler secret put ANTHROPIC_API_KEY
name = "caddaie-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Browser origins allowed to call the API (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://scottyfncodes.github.io,http://localhost:5173,http://localhost:4173"
# Model used for the caddie explanation. Override per environment if needed.
CADDAIE_MODEL = "claude-opus-5"
RATE_LIMIT_PER_MINUTE = "20"
